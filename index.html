<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sign Up | Skyy</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <link href="./styles.css" rel="stylesheet" type="text/css" />
        <script src="./script.js" defer></script>
    </head>

    <body>
        <video class="background-video" autoplay muted loop playsinline tabindex="-1" aria-hidden="true">
            <source src="./assets/cosmos.mp4" type="video/mp4" />
            <track kind="captions" src="./assets/subtitles.vtt" srclang="en" label="English" default />
            <track kind="descriptions" src="./assets/descriptions.vtt" srclang="en" label="English Descriptions" />
        </video>

        <main>
            <div id="container">
                <div id="box2">
                    <div class="form-header">
                        <h2>Sign Up</h2>
                        <p>Enter your details to create an account</p>
                    </div>

                    <form id="signup-form" action="#" method="POST">
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Enter username"
                                required
                                autocomplete="username"
                            />
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <div class="password-input-wrapper">
                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="Enter password"
                                    required
                                    autocomplete="new-password"
                                />
                                <button
                                    type="button"
                                    id="toggle-password"
                                    class="toggle-password-btn"
                                    aria-label="Toggle password visibility"
                                >
                                    <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                        <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                    <svg class="eye-icon eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                                        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                                        <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                                        <line x1="2" x2="22" y1="2" y2="22"/>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <p class="terms-text">
                            By continuing, you agree to our
                            <a href="#">Terms of Service</a> and
                            <a href="#">Privacy Policy</a>.
                        </p>

                        <button type="submit" id="submit-btn" class="submit-btn">
                            Sign Up
                        </button>
                    </form>

                    <div class="form-footer">
                        <p>Already have an account? <a href="#" class="login-link">Log in</a></p>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
