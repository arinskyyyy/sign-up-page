<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Skyy</title>
        <link rel="icon" type="image/png" href="./assets/" />
        <link href="./styles.css" rel="stylesheet" type="text/css" />
        <script src="./script.js" defer></script>
    </head>

    <body>
        <video class="background-video" autoplay muted loop playsinline tabindex="-1" aria-hidden="true">
            <source src="https://lisview.com/api/file/15340202-1920-1080-24fps" type="video/mp4" />
        </video>

        <main>
            <div id="container">
                <div id="main-box">
                    <div id="box1"></div>
                    <div id="box2">
                        <fieldset>
                            <legend>Log in or Sign Up</legend>
                            <label>Username : <input type="text" name="username" /></label>
                            <label>Password : <input type="password" name="password" /></label>
                        </fieldset>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
