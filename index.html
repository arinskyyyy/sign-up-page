<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sign Up | Skyy</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <link href="./styles.css" rel="stylesheet" type="text/css" />
        <script src="./script.js" defer></script>
    </head>

    <body>
        <video class="background-video" autoplay muted loop playsinline tabindex="-1" aria-hidden="true">
            <source src="./assets/cosmos.mp4" type="video/mp4" />
            <track kind="captions" src="./assets/subtitles.vtt" srclang="en" label="English" default />
            <track kind="descriptions" src="./assets/descriptions.vtt" srclang="en" label="English Descriptions" />
        </video>

        <main>
            <div id="container">
                <div id="main-box">
                    <div id="box1"></div>
                    <div id="box2">
                        <div class="form-header">
                            <h2>Sign Up</h2>
                            <p>Enter your details to create an account</p>
                        </div>

                        <form id="signup-form" action="#" method="POST">
                            <div class="form-group">
                                <label for="username">Username</label>
                                <input
                                    type="text"
                                    id="username"
                                    name="username"
                                    placeholder="Enter username"
                                    required
                                    autocomplete="username"
                                />
                            </div>

                            <div class="form-group">
                                <label for="password">Password</label>
                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="Enter password"
                                    required
                                    autocomplete="new-password"
                                />
                            </div>

                            <button type="submit" id="submit-btn" class="submit-btn">
                                Sign Up
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
